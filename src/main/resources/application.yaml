spring:
  application:
    name: dapr-workflow-spring

  # Spring AI - Google Gemini Configuration (FREE)
  # Get your API key from: https://aistudio.google.com/apikey
  ai:
    openai:
      api-key: ${GROQ_API_KEY:your-groq-api-key-here}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.7

# Dapr Workflow Configuration
dapr:
  workflow:
    enabled: true

# Server Configuration
server:
  port: 8081

# Logging
logging:
  level:
    org.springframework.ai: DEBUG
    com.hdfcbank: DEBUG
